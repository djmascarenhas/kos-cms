server {
  listen 80;
  server_name cms.chapada.ia.br;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80;
  server_name kos.chapada.ia.br;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name cms.chapada.ia.br;

  ssl_certificate /etc/letsencrypt/live/cms.chapada.ia.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cms.chapada.ia.br/privkey.pem;

  location / {
    proxy_pass http://cms:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  server_name kos.chapada.ia.br;

  ssl_certificate /etc/letsencrypt/live/cms.chapada.ia.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cms.chapada.ia.br/privkey.pem;

  location / {
    proxy_pass http://kos:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
